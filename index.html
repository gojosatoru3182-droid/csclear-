<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>CSClear - Real Translator</title>
<style>
body{margin:0;font-family:Arial;background:#f8fafc}
nav{background:#fff;padding:14px 5%;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:16px 5%}
textarea{width:100%;height:130px;padding:10px;border:1px solid #ccc;border-radius:8px}
button{background:#2563eb;color:#fff;padding:12px;border:none;border-radius:8px;width:100%;font-weight:600}
.result{background:#eff6ff;border:1px solid #bfdbfe;padding:12px;border-radius:8px;min-height:70px;margin-top:10px}
</style>
</head>
<body>
<nav><b>CSClear</b><span style="font-size:11px">Real Translator • Phone Made</span></nav>

<div class="card">
<h3>Paste Chinese Form</h3>
<textarea id="input" placeholder="例如: 奖学金类别 B类 受理机构编号 10486"></textarea>
<button onclick="translateNow()">Translate to English →</button>
<div id="output" class="result">Translation will appear here...</div>
<div id="context" style="margin-top:10px;font-size:13px;background:#fffbeb;padding:10px;border-radius:8px;display:none"></div>
</div>

<div class="card">
<p style="font-size:12px;color:#666">Built on phone by V Divyashree, Bangalore. Python logic → Web version. For Wuhan University 10486 application.</p>
</div>

<script>
// This is the Python logic you know, just written for browser
const dict = {
"10486":"Wuhan University - your target!",
"10614":"UESTC - Chengdu, best for CS",
"奖学金类别":"Scholarship Category: B = University direct",
"受理机构编号":"Agency Number: Must match exact university code"
};

async function translateNow(){
let text=document.getElementById('input').value;
if(!text){alert('Paste Chinese first');return;}
document.getElementById('output').innerText='Translating...';
try{
let res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN|en');
let data=await res.json();
let eng=data.responseData.translatedText;
document.getElementById('output').innerText=eng;

// show context
let ctx=[];
for(let k in dict){if(text.includes(k)) ctx.push(k+': '+dict[k])}
let cbox=document.getElementById('context');
if(ctx.length){cbox.style.display='block';cbox.innerHTML=ctx.join('<br><br>')}
}catch(e){document.getElementById('output').innerText='Error, check internet and try again';}
}
</script>
</body>
                                                                                                                                                     </html>
